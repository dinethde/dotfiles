# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Change prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Vim style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim style pane resizing
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

# Resize mode: prefix + w enters, then resize without the prefix.
# tmux resets the key table to root after every key, so each binding
# re-enters resize-mode; it also clears the message line on every
# keypress, so the hint is redrawn each time too.
set -g @resize_hint " RESIZE MODE — h/j/k/l: 1  H/J/K/L: 5  Enter/Esc/q: exit "
bind-key w switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"

bind-key -T resize-mode h resize-pane -L 1 \; switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"
bind-key -T resize-mode j resize-pane -D 1 \; switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"
bind-key -T resize-mode k resize-pane -U 1 \; switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"
bind-key -T resize-mode l resize-pane -R 1 \; switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"
bind-key -T resize-mode H resize-pane -L 5 \; switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"
bind-key -T resize-mode J resize-pane -D 5 \; switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"
bind-key -T resize-mode K resize-pane -U 5 \; switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"
bind-key -T resize-mode L resize-pane -R 5 \; switch-client -T resize-mode \; display-message -d 0 "#{@resize_hint}"

bind-key -T resize-mode Enter  switch-client -T root
bind-key -T resize-mode Escape switch-client -T root
bind-key -T resize-mode q      switch-client -T root

bind \\ split-window -h
bind - split-window -v

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0' # See https://github.com/catppuccin/tmux/tags for additional tags

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
